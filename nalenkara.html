  :root{

    --measure:900px; --nav-h:54px;
    --font:"Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
    --font-head:"Literata",Georgia,"Times New Roman",serif;

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);

  #content{flex:1;min-height:0;position:relative}

  #stage.loading::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;

  /* interstitial card view (pages mode) */

  /* cover card: page 1 blurred under the title, or the comic's own cover page (CONFIG.cover) */

  .cover{position:relative;width:100%;height:100%;min-height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg)}
  #layer .cover{height:auto;min-height:0;aspect-ratio:var(--cover-ar,3/4);max-height:100vh}

  .cover.blur img{filter:blur(10px) brightness(.5);transform:scale(1.08)}

  .cover .words{position:relative;text-align:center;padding:24px;max-width:var(--measure)}
  .cover .ctitle{font-family:"Philosopher",Georgia,serif;font-weight:700;font-size:clamp(40px,8vw,84px);line-height:1.05;margin:0;color:var(--text)}
  .cover .cby{font-family:"Yeseva One",Georgia,serif;font-size:clamp(24px,3.6vw,38px);margin:18px 0 0;color:var(--tint)}

  /* card + endcap shared look */
  .card{margin:0 auto;max-width:var(--measure);text-align:center}

  function canVert(d){
    var g=gridInfo();
    if(g){ var t=g.local+d*(g.c.grid.swap?1:g.cols); if(t>=0&&t<g.span){ return true; } }
    if(mode!=="pages"||onCard||!MULTI){ return false; }
    var t2=PAGES[page].chapter+d; return t2>=0&&t2<CHAPTERS.length;
  }
  function syncDpad(){
    var pad=document.getElementById("dpad"); if(!pad){ return; }
    var on=(mode==="pages"&&!onCard&&(!!gridInfo()||(MULTI&&CHAPTERS.length>1)));
    pad.classList.toggle("on",on); if(!on){ return; }
    document.getElementById("dUp").classList.toggle("live",canVert(-1));
    document.getElementById("dDown").classList.toggle("live",canVert(1));
    document.getElementById("dLeft").classList.toggle("live",page>0);
    document.getElementById("dRight").classList.toggle("live",page<TOTAL-1);
  }
  function gridHorizontal(d){
    var g=gridInfo(); if(!g||!g.c.grid.swap){ return false; }
    return gridJump(d*g.cols);
  }
  function syncEdges(){
    var up=document.getElementById("edgeUp"), dn=document.getElementById("edgeDown");
    if(!up||!dn){ return; }
    var canUp=false, canDn=false;
    if(mode==="pages"&&!onCard){
      if(stage.scrollHeight>stage.clientHeight+2){
        canUp=stage.scrollTop>2;
        canDn=stage.scrollTop+stage.clientHeight<stage.scrollHeight-2;
      } else {
        var g=gridInfo();
        if(g){
          var d=(g.c.grid.swap?1:g.cols);
          canUp=(g.local-d)>=0; canDn=(g.local+d)<g.span;
        }
      }
    }
    up.classList.toggle("on",canUp); dn.classList.toggle("on",canDn);
    syncDpad();
  }
  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey){return;} var tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"){return;}
    if(e.key==="?"){e.preventDefault();renderHelp();openSheet("help");return;}
    if(e.key==="t"||e.key==="T"){e.preventDefault();updateThumbCurrent();openSheet("thumbs");return;}
    if(e.key==="b"||e.key==="B"){e.preventDefault();toggleMark();return;}
    if(e.key==="v"||e.key==="V"){e.preventDefault();setMode(mode==="pages"?"scroll":"pages");return;}
    if(e.key==="Escape"){ if(document.querySelector(".sheet.open")){closeSheets();} else {closeAllPops();} return; }
    if(mode==="pages"){ switch(e.key){
      case "ArrowRight":case " ":e.preventDefault();if(!gridHorizontal(1)){step(1);}break; case "ArrowLeft":e.preventDefault();if(!gridHorizontal(-1)){step(-1);}break;
      case "ArrowDown":if(gridVertical(1)){e.preventDefault();}break;
      case "ArrowUp":if(gridVertical(-1)){e.preventDefault();}break;
      case "Home":e.preventDefault();go(0);break; case "End":e.preventDefault();go(TOTAL-1);break;
      case "+":case "=":e.preventDefault();setStageZoom(stageZoom*1.25);break; case "-":case "_":e.preventDefault();setStageZoom(stageZoom/1.25);break;
      case "0":e.preventDefault();setStageZoom(1,{reset:true});break; } return; }
    switch(e.key){ case " ":e.preventDefault();step(e.shiftKey?-1:1);break; case "ArrowDown":e.preventDefault();step(1);break;
      case "ArrowUp":e.preventDefault();step(-1);break; case "Home":e.preventDefault();vp.scrollTo({top:0,behavior:"smooth"});break;
      case "End":e.preventDefault();vp.scrollTo({top:maxScroll(),behavior:"smooth"});break; }
  });

  function buildDrive(){
    var a=document.getElementById("oDrive"); if(!a||!C.driveUrl){ return; }
    a.href=C.driveUrl; a.hidden=false;
  }

  /* ---------- boot ---------- */
  paintIcons(document);
  buildScroll();buildChapMenu();buildChapBar();buildThumbs();buildDrive();placeTicks();
  var savedPos=rd(K_POS,null); if(savedPos&&typeof savedPos.i==="number"){ page=Math.min(TOTAL-1,Math.max(0,savedPos.i)); }
  var savedMode=rd(K_MODE,(window.matchMedia&&matchMedia("(max-width:620px)").matches)?"scroll":"pages"); var s0=savedMode==="pages"?sPages:sScroll;
  fit=true;
  renderMarks();renderHelp();
  if(savedMode==="scroll"){ mode="pages";setMode("scroll"); } else if(COVER&&page===0){ showCard(COVER); } else { renderPage(); }
  setTimeout(function(){ if(mode==="scroll"){ if(page===0){ vp.scrollTop=0; } else if(nodes[page]){ vp.scrollTop=nodes[page].offsetTop; } } syncNav(); },60);
  window.addEventListener("resize",function(){ clearTimeout(window.__rz);window.__rz=setTimeout(function(){ syncNav(); },160); });
})();
</script>
