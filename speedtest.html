<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Speed test</title>
<style>body{font:20px/1.4 system-ui,sans-serif;margin:16px;background:#fff;color:#000}td{padding:4px 12px 4px 0}b{font-size:28px}</style>
</head><body>
<table id="t"><tr><td></td><td>average</td><td>median</td><td>done</td></tr></table>
<script>
var H={GitHub:"https://snadiya-alpha.github.io/",Cloudflare:"https://snadiya.cfimg.workers.dev/"},R={GitHub:[],Cloudflare:[]};
function load(u){return new Promise(function(ok){var t=performance.now(),i=new Image();i.onload=i.onerror=function(){ok(performance.now()-t)};i.src=u;});}
function row(){var t=document.getElementById("t");while(t.rows.length>1)t.deleteRow(1);
 for(var k in R){var a=R[k].slice().sort(function(x,y){return x-y}),n=a.length,av=n?a.reduce(function(s,x){return s+x},0)/n:0,md=n?a[n>>1]:0;
  var r=t.insertRow();r.innerHTML="<td>"+k+"</td><td><b>"+Math.round(av)+" ms</b></td><td>"+Math.round(md)+" ms</td><td>"+n+"</td>";}}
(async function(){for(var n=41;n<=60;n++){var f="whale/p0"+n+".webp",o=n%2?["GitHub","Cloudflare"]:["Cloudflare","GitHub"];
 for(var k of o){R[k].push(await load(H[k]+f));row();}}})();
</script></body></html>
