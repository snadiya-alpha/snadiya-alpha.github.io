<style>
  :root{
    --rose:#ecc1c2; --orange:#f49c58; --crimson:#c07184;
    --plum:#67264f; --violet:#5a356a; --ink:#1e1b2c;
    --surface:#393047; --text:var(--rose); --text-2:#cda6b5;
    --sep:rgba(236,193,194,.42);
    --font:"Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --font-head:"Literata",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font)}
  .wrap{max-width:940px;margin:0 auto;padding:48px 20px 72px}
  h1,h2{font-family:var(--font-head);font-weight:600}
  h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
    h2{font-size:20px;font-weight:700;margin:34px 0 12px;color:var(--text)}
  h2:first-of-type{margin-top:8px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{display:flex;flex-direction:column;gap:6px;padding:16px 18px;background:var(--surface);
    border:1px solid var(--sep);border-radius:10px;text-decoration:none;color:var(--text);
    transition:border-color .15s,background .15s}
  .card:hover,.card:focus-visible{background:var(--violet);border-color:var(--orange);outline:none}
  /* titles must never be clipped - they wrap instead */
  .name{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
  .meta{color:var(--text-2);font-size:13px}
  a.plain{color:var(--orange)}
  
  /*cards*/.wrap{max-width:1280px}.grid{align-items:start;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.card{display:flex;flex-direction:column;gap:0;padding:0}.card[hidden]{display:none}.thumbwrap{display:block;line-height:0;overflow:hidden;border-radius:11px 11px 0 0}.thumb{display:block;width:100%;height:230px;object-fit:contain;background:#15121b}.cardtext{display:flex;align-items:center;padding:14px 16px}.name{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere;color:var(--text)}.card.featured{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}.coll-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.coll{display:flex;flex-direction:column;gap:10px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:none}.jgrid.ready{display:block;position:relative}.jgrid.ready > .card{position:absolute;top:0;left:0}.jgrid.ready .thumb{height:100%;object-fit:cover}.coll-img{display:block;width:100%;height:220px;object-fit:cover;border-radius:4px}.coll-name{font-size:20px;line-height:1.25;overflow-wrap:anywhere}#games{margin-top:48px}.browse{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start}.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding:4px 12px 24px 2px}.grp{margin:0 0 28px}.grp h3{font-family:var(--snz-sans);font-weight:700;font-size:15px;line-height:1.2;text-transform:uppercase;margin:0 0 10px}.grp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}.opt{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:18px;line-height:1.3}.opt:hover{background:rgba(60,24,21,.08)}.opt input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--snz-deep-crimson)}.opt-t{flex:1;overflow-wrap:anywhere}.opt-n{font-variant-numeric:tabular-nums;font-weight:600}.opt.zero{cursor:not-allowed}.opt.zero:hover{background:none}#active{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:52px;margin:0 0 16px}#active .chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:inherit;cursor:pointer;display:inline-flex;align-items:baseline;gap:.45em;white-space:normal;text-align:left}.clear-btn{font:inherit;cursor:pointer}.filters-btn,.done-btn{display:none}@media (max-width:800px){.browse{grid-template-columns:1fr}.filters-btn{display:inline-block;font:600 18px var(--snz-sans);padding:.6em 1.2em;border-radius:100px;border:2px solid var(--snz-deep-crimson);background:var(--snz-ivory);color:var(--snz-deep-crimson);margin:0 0 12px;cursor:pointer}.side{position:fixed;inset:0 0 0 auto;width:min(360px,88vw);max-height:none;height:100vh;z-index:30;background:var(--snz-ivory);border-left:2px solid var(--snz-deep-crimson);padding:20px 16px;transform:translateX(105%);transition:transform .2s}.side.open{transform:none}.done-btn{display:block;margin:0 0 20px auto;font:600 18px var(--snz-sans);padding:.6em 1.2em;border-radius:100px;border:2px solid var(--snz-deep-crimson);background:var(--snz-deep-crimson);color:var(--snz-ivory);cursor:pointer}}/*endcards*/
